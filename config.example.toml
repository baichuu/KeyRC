# ~/.config/keyrc/config.toml
[general]
mode = "keys_only" # "full" also displays the modifier row.
opacity = 1.0 # From 0.0 (invisible) to 1.0 (opaque).
liquid_glass = false # Blur, tint, and specular glass highlights.

[keymap]
toggle_mode = "Ctrl+Alt+M"
quit = "Ctrl+Alt+Q"

[colors]
active_fg = "#719cd6"
key_text = "#c0c8d5"
background = "#192330"
border = "#252f3c"
