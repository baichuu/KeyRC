[package]
name = "keyrc"
version = "0.1.0"
description = "A lightweight native GTK keystroke overlay"
authors = ["baiyuechu"]
edition = "2021"
license = "MIT"

[dependencies]
evdev = "0.13.2"
gtk = "0.18"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
libappindicator = "0.9"
nix = { version = "0.29", features = ["poll"] }
rdev = "0.5"
toml = "0.9.8"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
